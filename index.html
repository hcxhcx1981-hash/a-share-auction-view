<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111116"><title>A股 09:25 竞价环境</title><style>:root{--bg:#111116;--card:#1b1b24;--line:#343442;--ink:#f4f2fa;--muted:#aaa6b7;--violet:#9c7cff;--up:#ef5c68;--flat:#bbb6c7;--down:#46b979;--ok:#46b979}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:560px;margin:auto;padding:20px 16px 32px}.eyebrow{color:var(--violet);font-size:12px;font-weight:800;letter-spacing:.1em}h1{font-size:25px;margin:4px 0}.sub,footer{color:var(--muted);font-size:13px}.online{display:inline-block;margin:10px 0;padding:4px 9px;border-radius:999px;background:#173626;color:var(--ok);font-size:12px;font-weight:700}.card{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.stats,.tails{display:grid;gap:10px}.stats{grid-template-columns:repeat(3,1fr)}.tails{grid-template-columns:repeat(4,1fr);margin-top:12px}.n{display:block;font-size:22px;font-weight:800}.label{font-size:12px;color:var(--muted)}.up .n{color:var(--up)}.flat .n{color:var(--flat)}.down .n{color:var(--down)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.box{padding:10px;border-radius:10px;background:#242430}.box .n{font-size:17px}.bar{height:12px;display:flex;overflow:hidden;border-radius:999px;background:#333}.bar i{display:block}.bar .up{background:var(--up)}.bar .flat{background:var(--flat)}.bar .down{background:var(--down)}footer{display:grid;gap:3px;margin-top:18px}.bad{color:#ff989f}</style></head><body><main><div class="eyebrow">A-SHARE AUCTION</div><h1>09:25 竞价环境</h1><div id="time" class="sub">正在读取真实数据…</div><div id="status" class="online" hidden>数据可用</div><section id="view" hidden><div class="card"><div class="stats"><div class="up"><b id="up" class="n"></b><span class="label">上涨</span></div><div class="flat"><b id="flat" class="n"></b><span class="label">平盘</span></div><div class="down"><b id="down" class="n"></b><span class="label">下跌</span></div></div><div class="pair"><div class="box"><b id="ratio" class="n"></b><span class="label">涨跌比</span></div><div class="box"><b id="median" class="n"></b><span class="label">涨跌中位数</span></div></div></div><div class="card"><div class="bar"><i id="bu" class="up"></i><i id="bf" class="flat"></i><i id="bd" class="down"></i></div><div class="tails"><div><span class="label">≥+2%</span><b id="p2" class="n"></b></div><div><span class="label">≤-2%</span><b id="m2" class="n"></b></div><div><span class="label">≥+5%</span><b id="p5" class="n"></b></div><div><span class="label">≤-5%</span><b id="m5" class="n"></b></div></div></div><footer><span id="source"></span><span id="universe"></span><span id="published"></span></footer></section></main><script>const $=x=>document.getElementById(x);function render(d){$('time').textContent=`数据日期 ${d.trade_date} · 快照 ${d.snapshot_time}`;$('status').hidden=false;$('view').hidden=false;for(const k of['up','flat','down'])$(k).textContent=d[k].toLocaleString();$('ratio').textContent=Number(d.up_down_ratio).toFixed(6);$('median').textContent=Number(d.median_change_pct).toFixed(6)+'%';for(const[k,id]of[['plus_2','p2'],['minus_2','m2'],['plus_5','p5'],['minus_5','m5']])$(id).textContent=d[k];const n=d.up+d.flat+d.down;for(const[k,id]of[['up','bu'],['flat','bf'],['down','bd']])$(id).style.width=(d[k]/n*100)+'%';$('source').textContent='数据源：'+d.source;$('universe').textContent='Universe：'+d.universe_count.toLocaleString();$('published').textContent='发布时间：'+d.published_at}async function load(){try{const r=await fetch('./public/latest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(!d.success)throw Error();render(d)}catch(e){$('time').textContent='数据暂不可用';$('time').className='sub bad'}}load();setInterval(load,30000)</script></body></html>
